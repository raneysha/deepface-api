<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9edf0; --panel: #ffffff; --ink: #17212b; --muted: #5d6b79;
    --line: #cfd7de; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d7efec;
    --bad: #b42318; --bad-soft: #fde7e4; --ok: #0f766e;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11171c; --panel: #1a2229; --ink: #e6ecf1; --muted: #92a1af; --line: #2c3841;
            --accent: #3fb6aa; --accent-ink: #08201d; --accent-soft: #17332f; --bad: #ff9b90; --bad-soft: #3a1d1a; --ok: #3fb6aa; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between;
           padding: 20px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); max-width: 52ch; }
  .key { display: flex; align-items: center; gap: 8px; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px;
         padding: 20px clamp(16px, 4vw, 40px) 48px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  h3 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; }
  input[type=file] { width: 100%; font: inherit; color: var(--muted); }
  button { font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .55; cursor: progress; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .people li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px;
                      background: transparent; color: var(--ink); border: 1px solid var(--line); margin-bottom: 6px; }
  .people li button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
  .people small { color: var(--muted); }
  .empty { color: var(--muted); padding: 8px 0; }
  .status li { font-size: 13px; padding: 4px 0; display: flex; gap: 8px; }
  .status .ok { color: var(--ok); } .status .err { color: var(--bad); }
  .banner { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--bad-soft); color: var(--bad); font-size: 14px; }
  .banner[hidden] { display: none; }
  .search-grid { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 600px) { .search-grid { grid-template-columns: 1fr; } }
  .query { width: 100%; aspect-ratio: 1; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg);
           display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; overflow: hidden; }
  .query img { width: 100%; height: 100%; object-fit: cover; }
  .match { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
  .mbody { flex: 1; min-width: 0; }
  .thumb { padding: 0; width: 72px; height: 72px; flex: none; border-radius: 6px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  dialog { max-width: min(92vw, 900px); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 12px; }
  dialog img { max-width: 100%; max-height: 75vh; display: block; margin: 0 auto 10px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .match.top { border-color: var(--accent); }
  .match .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .match .name { font-weight: 600; font-size: 16px; }
  .match .meta { color: var(--muted); font-size: 13px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin: 10px 0 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .badge.no { background: var(--bad-soft); color: var(--bad); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ink); font-size: 14px; }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  [hidden] { display: none !important; }
  .auth { max-width: 400px; margin: 8vh auto; padding: 0 16px; }
  .auth h1 { margin-bottom: 4px; }
  .link { background: none; border: 0; color: var(--accent); padding: 0; text-decoration: underline; }
  .who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .role { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-top: 8px; }
  .gallery .thumb { width: 100%; height: auto; aspect-ratio: 1; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); background: var(--bg); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .drop strong { display: block; color: var(--ink); margin-bottom: 8px; }
  .urow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .urow small { color: var(--muted); display: block; }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; }
  .urow select { width: auto; }
</style>
</head>
<body>

<div id="loginView" class="auth" hidden>
  <h1>Face finder</h1>
  <p style="color:var(--muted);margin:0 0 16px">Sign in to continue.</p>
  <section>
    <form id="loginForm">
      <label for="lemail">Email</label><input id="lemail" type="email" autocomplete="username" required>
      <label for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password" required>
      <div class="row"><button type="submit">Sign in</button></div>
    </form>
    <form id="signupForm" hidden>
      <label for="sname">Full name</label><input id="sname" type="text" autocomplete="name" required>
      <label for="semail">Email</label><input id="semail" type="email" autocomplete="username" required>
      <label for="spass">Password (at least 10 characters)</label><input id="spass" type="password" autocomplete="new-password" minlength="10" required>
      <div class="row"><button type="submit">Create client account</button></div>
    </form>
    <div class="banner" id="authErr" role="alert" hidden></div>
    <p style="margin:14px 0 0;font-size:14px"><span id="toggleText">New here?</span> <button type="button" class="link" id="toggleAuth">Create an account</button></p>
  </section>
</div>

<div id="appView" hidden>
<header>
  <div>
    <h1>Face finder</h1>
    <p id="tagline"></p>
  </div>
  <div class="who"><span id="who"></span><span class="role" id="roleTag"></span><button class="secondary" id="logout">Sign out</button></div>
</header>

<main>
  <div class="col">
    <section id="libSec" aria-labelledby="lib" hidden>
      <h2 id="lib">Photographers</h2>
      <ul class="people" id="people"></ul>
      <h3>Upload photos</h3>
      <p id="uploadHint" style="color:var(--muted);margin:0 0 8px">Select a photographer above first.</p>
      <div class="drop" id="drop">
        <strong>Drop photos or whole folders here</strong>
        <div class="row" style="justify-content:center;margin-top:0">
          <button type="button" class="secondary" id="pickFiles">Choose photos</button>
          <button type="button" class="secondary" id="pickFolder">Choose a folder</button>
        </div>
      </div>
      <input id="ufiles" type="file" accept="image/jpeg,image/png,image/webp,image/bmp" multiple hidden>
      <input id="ufolder" type="file" webkitdirectory multiple hidden>
      <p id="queueNote" style="color:var(--muted);font-size:13px;margin:8px 0 0"></p>
      <div id="queue" hidden>
        <div class="bar" role="progressbar" aria-label="Upload progress"><i id="progBar" style="width:0%"></i></div>
        <p id="progText" aria-live="polite" style="margin:4px 0 0;font-size:14px"></p>
        <div class="row">
          <button type="button" id="startBtn">Upload</button>
          <button type="button" class="secondary" id="cancelBtn" hidden>Stop after current photos</button>
          <button type="button" class="secondary" id="retryBtn" hidden>Retry failed</button>
          <button type="button" class="secondary" id="clearBtn">Clear list</button>
        </div>
        <ul class="status" id="problems"></ul>
      </div>
      <h3>Library</h3>
      <p id="galleryCount" style="color:var(--muted);font-size:13px;margin:0"></p>
      <div class="gallery" id="gallery"></div>
      <div class="row"><button type="button" class="secondary" id="moreBtn" hidden>Load more</button></div>
      <div class="banner" id="libErr" role="alert" hidden></div>
    </section>

    <section id="usersSec" aria-labelledby="usr" hidden>
      <h2 id="usr">Users</h2>
      <div id="userList"></div>
      <h3>Add a user</h3>
      <form id="userForm">
        <label for="uname">Full name</label><input id="uname" type="text" required>
        <label for="uemail">Email</label><input id="uemail" type="email" required>
        <label for="upass">Temporary password (10+ characters)</label><input id="upass" type="password" autocomplete="new-password" minlength="10" required>
        <label for="urole">Role</label>
        <select id="urole"><option value="photographer">Photographer</option><option value="client">Client</option><option value="admin">Admin</option></select>
        <div id="linkWrap"><label for="ulink">Existing photographer profile</label><select id="ulink"><option value="">Create a new profile</option></select></div>
        <div class="row"><button type="submit">Create user</button></div>
      </form>
      <div class="banner" id="userErr" role="alert" hidden></div>
    </section>
  </div>

  <section aria-labelledby="find">
    <h2 id="find">Find a face</h2>
    <form id="searchForm">
      <div class="search-grid">
        <div><div class="query" id="qbox">No photo selected</div></div>
        <div>
          <label for="qfile">Photo to search with</label>
          <input id="qfile" type="file" accept="image/*" required>
          <p id="scopeNote" style="color:var(--muted);font-size:13px;margin:8px 0 0"></p>
          <label class="check adminOnly" hidden><input type="checkbox" id="ann"> Use fast approximate search (after building the index)</label>
          <div class="row">
            <button type="submit" id="searchBtn">Search</button>
            <button type="button" class="secondary adminOnly" id="indexBtn" hidden>Rebuild search index</button>
          </div>
        </div>
      </div>
    </form>
    <div class="banner" id="searchErr" role="alert" hidden></div>
    <div id="results" aria-live="polite"></div>
  </section>
</main>
</div>

<dialog id="viewer" aria-label="Full size photo">
  <img id="fullImg" alt="Full size photo">
  <form method="dialog"><button class="secondary">Close</button></form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const TAGLINES = {
  admin: "Manage users, upload for any photographer and search every photo.",
  photographer: "Upload your photos, then search to find which of them contain a face.",
  client: "Upload a photo of yourself to find pictures you appear in.",
};
let me = null, selected = null, profiles = [];

function el(tag, props = {}, ...kids) { const n = Object.assign(document.createElement(tag), props); kids.forEach((k) => n.append(k)); return n; }
function show(node, msg) { node.textContent = msg || ""; node.hidden = !msg; }
function errText(body, res) {
  const d = body && body.detail;
  if (Array.isArray(d)) return d.map((x) => x.msg).join("; ");
  return typeof d === "string" ? d : `${res.status} ${res.statusText}`;
}

// The session lives in an httpOnly cookie (JS can't read it). The X-Requested-With header is the CSRF guard the server expects.
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-Requested-With": "fetch", ...(opts.headers || {}) } });
  let body = null;
  try { body = await res.json(); } catch (_) {}
  const fail = (msg) => Object.assign(new Error(msg), { status: res.status });
  if (res.status === 401 && !path.startsWith("/auth/login")) { showLogin(); throw fail("Please sign in again."); }
  if (!res.ok) throw fail(errText(body, res));
  return body;
}

// ---------- sign in / out ----------
function showLogin() { me = null; $("#appView").hidden = true; $("#loginView").hidden = false; }
$("#toggleAuth").onclick = () => {
  const signup = $("#signupForm").hidden;
  $("#signupForm").hidden = !signup; $("#loginForm").hidden = signup; show($("#authErr"), "");
  $("#toggleText").textContent = signup ? "Already registered?" : "New here?";
  $("#toggleAuth").textContent = signup ? "Sign in" : "Create an account";
};
$("#loginForm").onsubmit = async (e) => {
  e.preventDefault(); show($("#authErr"), "");
  try {
    const r = await api("/auth/login", { method: "POST", body: new URLSearchParams({ username: $("#lemail").value, password: $("#lpass").value }) });
    $("#lpass").value = ""; enter(r.user);
  } catch (err) { show($("#authErr"), err.message); }
};
$("#signupForm").onsubmit = async (e) => {
  e.preventDefault(); show($("#authErr"), "");
  try {
    const r = await api("/auth/signup", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_name: $("#sname").value.trim(), email: $("#semail").value, password: $("#spass").value }) });
    $("#spass").value = ""; enter(r.user);
  } catch (err) { show($("#authErr"), err.message); }
};
$("#logout").onclick = async () => { try { await api("/auth/logout", { method: "POST" }); } catch (_) {} $("#results").replaceChildren(); showLogin(); };

function enter(user) {
  me = user; selected = null; q = { items: [], running: false, cancel: false }; $("#gallery").replaceChildren(); renderQueue();
  $("#loginView").hidden = true; $("#appView").hidden = false;
  $("#who").textContent = user.full_name; $("#roleTag").textContent = user.role; $("#tagline").textContent = TAGLINES[user.role];
  const staff = user.role !== "client", admin = user.role === "admin";
  $("#libSec").hidden = !staff; $("#usersSec").hidden = !admin;
  document.querySelectorAll(".adminOnly").forEach((n) => (n.hidden = !admin));
  $("#lib").textContent = admin ? "Photographers" : "My photos";
  $("#people").hidden = !admin;
  $("#find").textContent = user.role === "client" ? "Find my photos" : "Find a face";
  $("#scopeNote").textContent = user.role === "photographer" ? "You will only see matches from your own photos." : "";
  if (staff) loadPeople();
  if (admin) loadUsers();
}

// ---------- photographers, uploads, gallery ----------
async function loadPeople() {
  try {
    profiles = await api("/photographers");
    const list = $("#people"); list.replaceChildren();
    if (!profiles.length) list.append(el("li", { className: "empty", textContent: "No photographer profiles yet. Create a photographer user below." }));
    profiles.forEach((p) => {
      const b = el("button", { type: "button" }, el("span", { textContent: p.name }), el("small", { textContent: `${p.upload_count} photo${p.upload_count === 1 ? "" : "s"}` }));
      b.setAttribute("aria-pressed", String(selected === p.id));
      b.onclick = () => select(p);
      list.append(el("li", {}, b));
    });
    if (me.role === "photographer" && profiles[0] && selected === null) select(profiles[0]);
    else if (selected !== null) loadGallery();
    if (me.role === "admin") fillLinkOptions();
    show($("#libErr"), "");
  } catch (e) { show($("#libErr"), `Could not load photographers: ${e.message}`); }
}
function select(p) {
  selected = p.id;
  $("#uploadHint").textContent = me.role === "admin" ? `Uploading as ${p.name}.` : "Choose photos to add to your library.";
  loadPeople();   // re-renders the list and, because a profile is selected, the gallery
}
const PAGE = 60; let galleryOffset = 0;
async function loadGallery(reset = true) {
  const g = $("#gallery");
  if (reset) { g.replaceChildren(); galleryOffset = 0; }
  try {
    const p = await api(`/photographers/${selected}?limit=${PAGE}&offset=${galleryOffset}`);
    p.uploads.forEach((u) => { if (u.thumb_url) g.append(thumb(u.thumb_url, u.image_url, u.filename || "Uploaded photo")); });
    galleryOffset += p.uploads.length;
    $("#galleryCount").textContent = p.total ? `Showing ${galleryOffset} of ${p.total} photo${p.total === 1 ? "" : "s"}` : "No photos yet.";
    $("#moreBtn").hidden = galleryOffset >= p.total;
  } catch (e) { show($("#libErr"), `Could not load photos: ${e.message}`); }
}
$("#moreBtn").onclick = () => loadGallery(false);
function thumb(thumbUrl, fullUrl, alt) {
  const b = el("button", { type: "button", className: "thumb", title: "View full size" }, el("img", { src: thumbUrl, alt, loading: "lazy" }));
  b.onclick = () => { $("#fullImg").src = fullUrl; $("#viewer").showModal(); };
  return b;
}
// ---------- mass upload ----------
// Files go up one request each, a few at a time, so one bad photo never sinks the batch and a dropped
// connection loses at most the photos in flight. The first photo goes alone: the server loads the face model
// on its first request and we don't want several requests all doing that at once.
const CONCURRENCY = 3;
const OK_TYPES = ["image/jpeg", "image/png", "image/webp", "image/bmp"], OK_EXT = /\.(jpe?g|png|webp|bmp)$/i;
const LABEL = { pending: "waiting", added: "added", skipped: "already registered", noface: "no face found", failed: "failed" };
let q = { items: [], running: false, cancel: false }, modelWarm = false;

function addFiles(files) {
  const seen = new Set(q.items.map((i) => i.key));
  let ignored = 0;
  for (const f of files) {
    const key = `${f.name}|${f.size}|${f.lastModified}`;
    if (!(OK_TYPES.includes(f.type) || OK_EXT.test(f.name))) { ignored++; continue; }
    if (seen.has(key)) continue;
    seen.add(key); q.items.push({ file: f, key, status: "pending", msg: "" });
  }
  $("#queueNote").textContent = ignored ? `${ignored} file${ignored === 1 ? "" : "s"} ignored: only JPG, PNG, WebP and BMP images are supported.` : "";
  renderQueue();
}

function renderQueue() {
  const c = { pending: 0, added: 0, skipped: 0, noface: 0, failed: 0 };
  q.items.forEach((i) => c[i.status]++);
  const total = q.items.length, done = total - c.pending;
  $("#queue").hidden = total === 0;
  $("#progBar").style.width = total ? `${(done / total) * 100}%` : "0%";
  const parts = [`${done} of ${total} processed`, `${c.added} added`];
  if (c.skipped) parts.push(`${c.skipped} already registered`);
  if (c.noface) parts.push(`${c.noface} no face found`);
  if (c.failed) parts.push(`${c.failed} failed`);
  $("#progText").textContent = parts.join(" · ");
  $("#startBtn").hidden = q.running || c.pending === 0;
  $("#startBtn").textContent = `Upload ${c.pending} photo${c.pending === 1 ? "" : "s"}`;
  $("#cancelBtn").hidden = !q.running;
  $("#retryBtn").hidden = q.running || c.failed === 0;
  $("#clearBtn").hidden = q.running;
  const list = $("#problems"); list.replaceChildren();
  const bad = q.items.filter((i) => i.status === "failed" || i.status === "noface");
  bad.slice(0, 50).forEach((i) => list.append(el("li", { className: i.status === "failed" ? "err" : "" },
    el("span", { textContent: LABEL[i.status] }), el("span", { textContent: `${i.file.name}: ${i.msg}` }))));
  if (bad.length > 50) list.append(el("li", { textContent: `…and ${bad.length - 50} more` }));
}

async function uploadOne(item, target) {
  try {
    const fd = new FormData(); fd.append("file", item.file);
    await api(`/photographers/${target}/uploads`, { method: "POST", body: fd });
    item.status = "added"; item.msg = "";
  } catch (err) {
    if (err.status === 401) { q.cancel = true; return; }   // session ended: leave it waiting so the batch can resume
    item.status = err.status === 409 ? "skipped" : err.status === 422 ? "noface" : "failed";
    item.msg = err.status === undefined ? "Network error. Check your connection, then retry." : err.message;
  }
}

async function runQueue() {
  if (selected === null) return show($("#libErr"), "Choose a photographer first.");
  show($("#libErr"), "");
  const target = selected;   // don't follow later clicks on another profile mid-batch
  q.running = true; q.cancel = false; renderQueue();
  const todo = q.items.filter((i) => i.status === "pending"); let next = 0;
  const worker = async () => { while (!q.cancel && next < todo.length) { await uploadOne(todo[next++], target); renderQueue(); } };
  if (!modelWarm && todo.length) { await uploadOne(todo[next++], target); renderQueue(); modelWarm = true; }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  q.running = false; renderQueue(); if (me) loadPeople();
}

async function filesFromDrop(dt) {
  const entries = [...dt.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);   // must be read synchronously
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async (entry) => {
    if (entry.isFile) out.push(await new Promise((res, rej) => entry.file(res, rej)));
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {   // readEntries returns results in chunks
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        for (const e of batch) await walk(e);
      }
    }
  };
  for (const e of entries) await walk(e);
  return out;
}

const drop = $("#drop");
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async (e) => addFiles(await filesFromDrop(e.dataTransfer)));
$("#pickFiles").onclick = () => $("#ufiles").click();
$("#pickFolder").onclick = () => $("#ufolder").click();
[$("#ufiles"), $("#ufolder")].forEach((inp) => (inp.onchange = () => { addFiles([...inp.files]); inp.value = ""; }));
$("#startBtn").onclick = runQueue;
$("#cancelBtn").onclick = () => { q.cancel = true; $("#cancelBtn").textContent = "Stopping…"; };
$("#retryBtn").onclick = () => { q.items.forEach((i) => { if (i.status === "failed") i.status = "pending"; }); runQueue(); };
$("#clearBtn").onclick = () => { q.items = []; $("#queueNote").textContent = ""; renderQueue(); };
window.addEventListener("beforeunload", (e) => { if (q.running) { e.preventDefault(); e.returnValue = ""; } });

// ---------- admin: users ----------
async function loadUsers() {
  try {
    const users = await api("/users"), box = $("#userList"); box.replaceChildren();
    users.forEach((u) => {
      const role = el("select", { ariaLabel: `Role for ${u.full_name}` });
      ["admin", "photographer", "client"].forEach((r) => role.append(el("option", { value: r, textContent: r, selected: r === u.role })));
      const active = el("input", { type: "checkbox", checked: u.is_active, ariaLabel: `${u.full_name} is active` });
      const patch = async (change) => {
        try { await api(`/users/${u.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(change) }); show($("#userErr"), ""); loadUsers(); loadPeople(); }
        catch (err) { show($("#userErr"), err.message); loadUsers(); }
      };
      role.onchange = () => patch({ role: role.value });
      active.onchange = () => patch({ is_active: active.checked });
      box.append(el("div", { className: "urow" },
        el("div", {}, el("strong", { textContent: u.full_name }), el("small", { textContent: u.email })),
        role, el("label", { style: "margin:0;display:flex;gap:6px;align-items:center" }, active, "Active")));
    });
  } catch (e) { show($("#userErr"), `Could not load users: ${e.message}`); }
}
function fillLinkOptions() {
  const sel = $("#ulink"); sel.replaceChildren(el("option", { value: "", textContent: "Create a new profile" }));
  profiles.filter((p) => p.user_id === null).forEach((p) => sel.append(el("option", { value: p.id, textContent: `Link existing: ${p.name}` })));
}
$("#urole").onchange = () => ($("#linkWrap").hidden = $("#urole").value !== "photographer");
$("#userForm").onsubmit = async (e) => {
  e.preventDefault();
  const link = $("#urole").value === "photographer" && $("#ulink").value ? Number($("#ulink").value) : null;
  try {
    await api("/users", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_name: $("#uname").value.trim(), email: $("#uemail").value, password: $("#upass").value, role: $("#urole").value, photographer_id: link }) });
    e.target.reset(); $("#linkWrap").hidden = false; show($("#userErr"), ""); loadUsers(); loadPeople();
  } catch (err) { show($("#userErr"), err.message); }
};

// ---------- search ----------
$("#qfile").onchange = (e) => {
  const f = e.target.files[0], box = $("#qbox");
  if (!f) return (box.textContent = "No photo selected");
  box.replaceChildren(el("img", { alt: "Photo to search with", src: URL.createObjectURL(f) }));
};
$("#searchForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = $("#qfile").files[0]; if (!f) return;
  const btn = $("#searchBtn"); btn.disabled = true; btn.textContent = "Searching…";
  show($("#searchErr"), ""); $("#results").replaceChildren();
  try {
    const fd = new FormData(); fd.append("file", f); fd.append("ann", me.role === "admin" && $("#ann").checked ? "true" : "false");
    renderResults((await api("/search", { method: "POST", body: fd })).matches);
  } catch (err) { show($("#searchErr"), `Search failed: ${err.message}`); }
  btn.disabled = false; btn.textContent = "Search";
};
$("#indexBtn").onclick = async () => {
  const b = $("#indexBtn"); b.disabled = true; b.textContent = "Rebuilding…";
  try { await api("/index", { method: "POST" }); show($("#searchErr"), ""); b.textContent = "Index rebuilt"; }
  catch (err) { show($("#searchErr"), `Could not rebuild the index: ${err.message}`); b.textContent = "Rebuild search index"; }
  setTimeout(() => { b.disabled = false; b.textContent = "Rebuild search index"; }, 1500);
};

function renderResults(matches) {
  const root = $("#results"); root.replaceChildren();
  const faces = (matches.length && !Array.isArray(matches[0])) ? [matches] : matches;   // one list per face found in the photo
  if (!faces.length || faces.every((f) => !f.length)) {
    root.append(el("p", { className: "empty", textContent: me.role === "client"
      ? "No matching photos were found. Try a clearer photo of your face."
      : "No registered face is close enough to this photo." }));
    return;
  }
  faces.forEach((hits, i) => {
    if (faces.length > 1) root.append(el("h3", { textContent: `Face ${i + 1} in the photo` }));
    [...hits].sort((a, b) => a.distance - b.distance).forEach((m, idx) => {
      const who = m.photographer ? (me.role === "client" ? `Photo by ${m.photographer.name}` : m.photographer.name) : "Photo not linked to a photographer";
      const same = m.threshold == null || m.distance <= m.threshold;
      const pct = m.confidence != null ? Math.max(0, Math.min(100, m.confidence)) : m.threshold ? Math.max(0, Math.min(100, (1 - m.distance / (m.threshold * 2)) * 100)) : 0;
      const card = el("div", { className: "match" + (idx === 0 && i === 0 ? " top" : "") }), body = el("div", { className: "mbody" });
      body.append(
        el("div", { className: "head" }, el("span", { className: "name", textContent: who }),
          el("span", { className: "badge" + (same ? "" : " no"), textContent: same ? "Same person" : "Probably different" })),
        el("div", { className: "bar", role: "img", ariaLabel: `Confidence ${Math.round(pct)} percent` }, el("i", { style: `width:${pct}%` })),
        el("div", { className: "meta", textContent: `${Math.round(pct)}% confidence` + (me.role === "client" ? "" : `, distance ${m.distance.toFixed(3)}` + (m.threshold != null ? ` (limit ${m.threshold.toFixed(3)})` : "")) }));
      const bits = [];
      if (m.photographer && m.photographer.email) bits.push(m.photographer.email);
      if (m.upload && m.upload.filename) bits.push(`matched photo: ${m.upload.filename}`);
      if (bits.length) body.append(el("div", { className: "meta", textContent: bits.join(", ") }));
      if (m.upload && m.upload.thumb_url) card.append(thumb(m.upload.thumb_url, m.upload.image_url, `Matched ${who}`));
      card.append(body); root.append(card);
    });
  });
}

(async () => { try { enter(await api("/auth/me")); } catch (_) { showLogin(); } })();
</script>
